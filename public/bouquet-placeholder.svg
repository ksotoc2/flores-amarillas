<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 600" width="520" height="600">
  <defs>
    <radialGradient id="bgGrad" cx="50%" cy="60%" r="60%">
      <stop offset="0%" stop-color="#fef9c3"/>
      <stop offset="100%" stop-color="#fde68a"/>
    </radialGradient>
    <radialGradient id="centerGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#92400e"/>
      <stop offset="100%" stop-color="#78350f"/>
    </radialGradient>
  </defs>

  <!-- Background -->
  <rect width="520" height="600" fill="url(#bgGrad)" rx="24"/>

  <!-- Stems -->
  <line x1="260" y1="540" x2="200" y2="360" stroke="#4d7c0f" stroke-width="6" stroke-linecap="round"/>
  <line x1="260" y1="540" x2="260" y2="330" stroke="#4d7c0f" stroke-width="6" stroke-linecap="round"/>
  <line x1="260" y1="540" x2="320" y2="350" stroke="#4d7c0f" stroke-width="6" stroke-linecap="round"/>
  <line x1="260" y1="540" x2="150" y2="310" stroke="#4d7c0f" stroke-width="5" stroke-linecap="round"/>
  <line x1="260" y1="540" x2="370" y2="305" stroke="#4d7c0f" stroke-width="5" stroke-linecap="round"/>
  <line x1="260" y1="540" x2="120" y2="340" stroke="#4d7c0f" stroke-width="4" stroke-linecap="round"/>
  <line x1="260" y1="540" x2="400" y2="340" stroke="#4d7c0f" stroke-width="4" stroke-linecap="round"/>

  <!-- Leaves -->
  <ellipse cx="215" cy="430" rx="28" ry="12" fill="#4d7c0f" transform="rotate(-40 215 430)" opacity="0.9"/>
  <ellipse cx="305" cy="420" rx="28" ry="12" fill="#4d7c0f" transform="rotate(40 305 420)" opacity="0.9"/>
  <ellipse cx="170" cy="385" rx="22" ry="10" fill="#65a30d" transform="rotate(-55 170 385)" opacity="0.8"/>
  <ellipse cx="355" cy="375" rx="22" ry="10" fill="#65a30d" transform="rotate(55 355 375)" opacity="0.8"/>

  <!-- Helper macro: sunflower at (cx,cy) with radius r -->
  <!-- Sunflower 1 — center big -->
  <g transform="translate(260,270)">
    <g>
      <ellipse rx="38" ry="16" fill="#fbbf24" transform="rotate(0)"/>
      <ellipse rx="38" ry="16" fill="#fbbf24" transform="rotate(30)"/>
      <ellipse rx="38" ry="16" fill="#fbbf24" transform="rotate(60)"/>
      <ellipse rx="38" ry="16" fill="#fbbf24" transform="rotate(90)"/>
      <ellipse rx="38" ry="16" fill="#fbbf24" transform="rotate(120)"/>
      <ellipse rx="38" ry="16" fill="#fbbf24" transform="rotate(150)"/>
    </g>
    <circle r="28" fill="url(#centerGrad)"/>
    <circle r="18" fill="#92400e" opacity="0.7"/>
  </g>

  <!-- Sunflower 2 — left -->
  <g transform="translate(165,295)">
    <g>
      <ellipse rx="30" ry="13" fill="#f59e0b" transform="rotate(0)"/>
      <ellipse rx="30" ry="13" fill="#f59e0b" transform="rotate(30)"/>
      <ellipse rx="30" ry="13" fill="#f59e0b" transform="rotate(60)"/>
      <ellipse rx="30" ry="13" fill="#f59e0b" transform="rotate(90)"/>
      <ellipse rx="30" ry="13" fill="#f59e0b" transform="rotate(120)"/>
      <ellipse rx="30" ry="13" fill="#f59e0b" transform="rotate(150)"/>
    </g>
    <circle r="22" fill="url(#centerGrad)"/>
    <circle r="14" fill="#92400e" opacity="0.7"/>
  </g>

  <!-- Sunflower 3 — right -->
  <g transform="translate(355,285)">
    <g>
      <ellipse rx="30" ry="13" fill="#fde047" transform="rotate(15)"/>
      <ellipse rx="30" ry="13" fill="#fde047" transform="rotate(45)"/>
      <ellipse rx="30" ry="13" fill="#fde047" transform="rotate(75)"/>
      <ellipse rx="30" ry="13" fill="#fde047" transform="rotate(105)"/>
      <ellipse rx="30" ry="13" fill="#fde047" transform="rotate(135)"/>
      <ellipse rx="30" ry="13" fill="#fde047" transform="rotate(165)"/>
    </g>
    <circle r="22" fill="url(#centerGrad)"/>
    <circle r="14" fill="#92400e" opacity="0.7"/>
  </g>

  <!-- Sunflower 4 — far left -->
  <g transform="translate(108,325)">
    <g>
      <ellipse rx="26" ry="11" fill="#fbbf24" transform="rotate(0)"/>
      <ellipse rx="26" ry="11" fill="#fbbf24" transform="rotate(30)"/>
      <ellipse rx="26" ry="11" fill="#fbbf24" transform="rotate(60)"/>
      <ellipse rx="26" ry="11" fill="#fbbf24" transform="rotate(90)"/>
      <ellipse rx="26" ry="11" fill="#fbbf24" transform="rotate(120)"/>
      <ellipse rx="26" ry="11" fill="#fbbf24" transform="rotate(150)"/>
    </g>
    <circle r="19" fill="url(#centerGrad)"/>
    <circle r="12" fill="#92400e" opacity="0.7"/>
  </g>

  <!-- Sunflower 5 — far right -->
  <g transform="translate(412,318)">
    <g>
      <ellipse rx="26" ry="11" fill="#f59e0b" transform="rotate(10)"/>
      <ellipse rx="26" ry="11" fill="#f59e0b" transform="rotate(40)"/>
      <ellipse rx="26" ry="11" fill="#f59e0b" transform="rotate(70)"/>
      <ellipse rx="26" ry="11" fill="#f59e0b" transform="rotate(100)"/>
      <ellipse rx="26" ry="11" fill="#f59e0b" transform="rotate(130)"/>
      <ellipse rx="26" ry="11" fill="#f59e0b" transform="rotate(160)"/>
    </g>
    <circle r="19" fill="url(#centerGrad)"/>
    <circle r="12" fill="#92400e" opacity="0.7"/>
  </g>

  <!-- Small daisies -->
  <g transform="translate(210,230)">
    <ellipse rx="18" ry="8" fill="#fef08a" transform="rotate(0)"/>
    <ellipse rx="18" ry="8" fill="#fef08a" transform="rotate(45)"/>
    <ellipse rx="18" ry="8" fill="#fef08a" transform="rotate(90)"/>
    <ellipse rx="18" ry="8" fill="#fef08a" transform="rotate(135)"/>
    <circle r="12" fill="#f59e0b"/>
  </g>
  <g transform="translate(318,238)">
    <ellipse rx="18" ry="8" fill="#fef08a" transform="rotate(20)"/>
    <ellipse rx="18" ry="8" fill="#fef08a" transform="rotate(65)"/>
    <ellipse rx="18" ry="8" fill="#fef08a" transform="rotate(110)"/>
    <ellipse rx="18" ry="8" fill="#fef08a" transform="rotate(155)"/>
    <circle r="12" fill="#f59e0b"/>
  </g>

  <!-- Bow / ribbon at base -->
  <g transform="translate(260,540)">
    <ellipse cx="-35" cy="-10" rx="38" ry="18" fill="#f59e0b" transform="rotate(-25 -35 -10)" opacity="0.9"/>
    <ellipse cx="35" cy="-10" rx="38" ry="18" fill="#f59e0b" transform="rotate(25 35 -10)" opacity="0.9"/>
    <circle r="16" fill="#d97706"/>
    <circle r="10" fill="#fbbf24"/>
  </g>

  <!-- Sparkle dots -->
  <circle cx="80" cy="180" r="5" fill="#fbbf24" opacity="0.8"/>
  <circle cx="440" cy="200" r="4" fill="#f59e0b" opacity="0.7"/>
  <circle cx="100" cy="500" r="3" fill="#fde68a" opacity="0.9"/>
  <circle cx="430" cy="490" r="3" fill="#fbbf24" opacity="0.8"/>
  <circle cx="60"  cy="300" r="3" fill="#f59e0b" opacity="0.6"/>
  <circle cx="460" cy="310" r="3" fill="#fde68a" opacity="0.7"/>

  <!-- "Placeholder" label -->
  <text x="260" y="580" text-anchor="middle" fill="#92400e" font-family="Georgia, serif"
        font-size="13" opacity="0.6">
    [ Reemplaza esta imagen con tu foto del ramo ]
  </text>
</svg>
